services:
  yb:
    # psql -h localhost -p 5436 -U yugabyte -d yugabyte -c "SELECT * FROM yb_servers();"
    build:
      context: .
      dockerfile: docker/Dockerfile.yb
    environment:
      - YUGABYTED_JOIN=${COMPOSE_PROJECT_NAME}-yb-1
      - TSERVER_FLAGS=yb_enable_read_committed_isolation=true
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    ports:
      - "5430-5439:5433"
      - "7000-7009:7000"
      - "9000-9009:9000"
      - "15430-15439:15433"
    networks: [net]

  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks: [net]

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    environment:
      DATABASE_URL: postgres://yugabyte:yugabyte@${COMPOSE_PROJECT_NAME}-yb-1:5433/yugabyte?sslmode=disable
      KAFKA_BROKER: "broker:9092"
    depends_on: [broker, yb]
    deploy:
      replicas: 4
    networks: [net]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [app]
    networks: [net]

networks:
  net:
